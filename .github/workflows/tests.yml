name: tests

on:
  push:
  pull_request:

jobs:
  default-tier:
    # Deterministic tier only: no Ollama, no model downloads, no notebook
    # execution. The notebook and local_integration tiers are local-only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Create config.yaml from the example
        run: cp config_example.yaml config.yaml

      - name: Run default test tier
        run: python -m pytest
